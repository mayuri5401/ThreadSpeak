name: ThreadSpeak CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # =========================================================
  # Job 1: Build & Test Frontend (React + Vite)
  # =========================================================
  frontend-build:
    name: 🌐 Frontend Build (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # =========================================================
  # Job 2: Build Backend Microservices (Java 17 + Maven)
  # =========================================================
  backend-build:
    name: ☕ Backend Build (Java 17 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build all microservices with Maven
        working-directory: backend
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: List built JARs
        working-directory: backend
        run: find . -name "*.jar" -not -path "*/original*" | sort
