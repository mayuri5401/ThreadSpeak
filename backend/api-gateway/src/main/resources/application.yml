server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,application/xml
    min-response-size: 1024

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
        pool:
          type: ELASTIC
          max-idle-time: 30s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: content-service-tracks
          uri: ${CONTENT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/tracks/**, /api/topics/**, /system-design/**, /api/system-design/**

        - id: user-service-progress
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/progress/**, /api/users/**

        - id: quiz-service-quizzes
          uri: ${QUIZ_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/quizzes/**

        - id: code-runner-service
          uri: ${CODE_RUNNER_URI:http://localhost:8084}
          predicates:
            - Path=/api/code/**, /api/simulators/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
