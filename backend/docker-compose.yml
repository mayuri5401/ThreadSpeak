version: '3.8'

services:
  # =========================================================================
  # 0. Apache Kafka Distributed Event Bus (KRaft Mode)
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: threadspeak-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - threadspeak-net

  # =========================================================================
  # 1. Netflix Eureka Discovery Server
  # =========================================================================
  eureka-server:
    image: openjdk:17-slim
    container_name: threadspeak-eureka
    working_dir: /app
    volumes:
      - ./eureka-server/target/eureka-server-1.0.0.jar:/app/app.jar
    command: ["java", "-jar", "app.jar"]
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - threadspeak-net

  # =========================================================================
  # 2. Spring Cloud API Gateway
  # =========================================================================
  api-gateway:
    image: openjdk:17-slim
    container_name: threadspeak-gateway
    working_dir: /app
    volumes:
      - ./api-gateway/target/api-gateway-1.0.0.jar:/app/app.jar
    command: ["java", "-jar", "app.jar"]
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - threadspeak-net

  # =========================================================================
  # 3. Content & Topic Microservice
  # =========================================================================
  content-service:
    image: openjdk:17-slim
    container_name: threadspeak-content-service
    working_dir: /app
    volumes:
      - ./content-service/target/content-service-1.0.0.jar:/app/app.jar
    command: ["java", "-jar", "app.jar"]
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - threadspeak-net

  # =========================================================================
  # 4. User Profile & Progress Microservice
  # =========================================================================
  user-service:
    image: openjdk:17-slim
    container_name: threadspeak-user-service
    working_dir: /app
    volumes:
      - ./user-service/target/user-service-1.0.0.jar:/app/app.jar
    command: ["java", "-jar", "app.jar"]
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - threadspeak-net

  # =========================================================================
  # 5. Quiz & Assessment Microservice
  # =========================================================================
  quiz-service:
    image: openjdk:17-slim
    container_name: threadspeak-quiz-service
    working_dir: /app
    volumes:
      - ./quiz-service/target/quiz-service-1.0.0.jar:/app/app.jar
    command: ["java", "-jar", "app.jar"]
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_started
      user-service:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - threadspeak-net

  # =========================================================================
  # 6. Sandboxed Code Execution & Simulator Microservice
  # =========================================================================
  code-runner-service:
    image: openjdk:17-slim
    container_name: threadspeak-code-runner-service
    working_dir: /app
    volumes:
      - ./code-runner-service/target/code-runner-service-1.0.0.jar:/app/app.jar
    command: ["java", "-jar", "app.jar"]
    ports:
      - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - threadspeak-net

networks:
  threadspeak-net:
    driver: bridge
